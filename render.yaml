services:
  - type: web
    name: lumiere-botanics
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lumiere-botanics.com
      - key: ADMIN_PASSWORD
        value: lumiere2026!
    disk:
      name: lumiere-data
      mountPath: /app/data
      sizeGB: 1
