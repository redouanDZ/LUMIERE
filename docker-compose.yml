version: '3.8'

services:
  lumiere-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumiere_platform
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_FILE=/app/data/lumiere.db
    volumes:
      - lumiere_data:/app/data

volumes:
  lumiere_data:
    driver: local
